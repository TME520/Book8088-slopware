# From this directory, after `make dos`:
#   dosbox-x -conf dosbox.conf
# `mount C .` uses the host working directory, so start DOSBox here.
# cputype=8086 needs DOSBox-X or DOSBox Staging (not DOSBox 0.74).

[sdl]
fullscreen=false
output=surface
windowresolution=800x600

[dosbox]
machine=ega
memsize=1
captures=captures

[cpu]
core=normal
cputype=8086
cycles=4000

[autoexec]
@echo off
mount C .
C:
LPSCOMP.EXE C:\LPS
