# The copies to put on the Book are ../LPSCOMP.EXE and ../HELLO.EXE
# (repository root). This config mounts the current directory, so either
# `cp ../LPSCOMP.EXE .` or `make dos`, then from here:
#   dosbox-x -conf dosbox.conf
# `mount C .` uses the host working directory, so start DOSBox here.
# cputype=8086 needs DOSBox-X or DOSBox Staging (not DOSBox 0.74).

[sdl]
fullscreen=false
output=surface
windowresolution=800x600

[dosbox]
machine=ega
memsize=1
captures=captures

[cpu]
core=normal
cputype=8086
cycles=4000

[autoexec]
@echo off
mount C .
C:
LPSCOMP.EXE C:\LPS
