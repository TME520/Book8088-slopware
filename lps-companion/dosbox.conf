# The copies to put on the Book are ../LPSCOMP.EXE, ../ROSARY.DAT,
# ../MEALS.DAT, ../MEALSCGA.DAT and ../HELLO.EXE (repository root). This
# config mounts the current directory, so either
# `cp ../LPSCOMP.EXE ../ROSARY.DAT ../MEALS.DAT ../MEALSCGA.DAT .` or
# `make dos rosary meals mealscga`, then from here:
#   dosbox-x -conf dosbox.conf
# `mount C .` uses the host working directory, so start DOSBox here.
# cputype=8086 needs DOSBox-X or DOSBox Staging (not DOSBox 0.74).
# The Book 8088 has CGA: set machine=cga to see its Meal Planner; machine=ega
# shows the EGA one. For 8088 speed use cycles=fixed 300 (see README).

[sdl]
fullscreen=false
output=surface
windowresolution=800x600

[dosbox]
machine=ega
memsize=1
captures=captures

[cpu]
core=normal
cputype=8086
cycles=4000

[autoexec]
@echo off
mount C .
C:
LPSCOMP.EXE C:\LPS
